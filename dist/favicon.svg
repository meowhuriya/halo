<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0E2238"/>
      <stop offset="100%" stop-color="#05070D"/>
    </radialGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38E1FF"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bgGlow)"/>
  <rect width="510" height="510" x="1" y="1" rx="99" fill="none" stroke="rgba(56, 225, 255, 0.2)" stroke-width="2"/>

  <!-- Halo Outer Orbit Ring -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="rgba(56, 225, 255, 0.15)" stroke-width="6" stroke-dasharray="12 8"/>

  <!-- Glowing Vital Ring -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="url(#cyanGrad)" stroke-width="12" filter="url(#glow)"/>

  <!-- Pulse / ECG Line across center -->
  <path d="M 140 256 L 195 256 L 215 220 L 235 295 L 260 170 L 285 330 L 305 240 L 325 265 L 340 256 L 372 256" 
        fill="none" 
        stroke="#FFFFFF" 
        stroke-width="10" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- Center Accent Star / Dot -->
  <circle cx="256" cy="116" r="8" fill="#38E1FF" filter="url(#glow)"/>
  <circle cx="396" cy="256" r="6" fill="#38E1FF"/>
  <circle cx="116" cy="256" r="6" fill="#38E1FF"/>

  <!-- Text HALO -->
  <text x="256" y="445" 
        text-anchor="middle" 
        fill="#38E1FF" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="34" 
        font-weight="900" 
        letter-spacing="12">HALO</text>
</svg>
